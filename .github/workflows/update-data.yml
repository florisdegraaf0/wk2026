name: Update site data

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. These two slots cover 10:00 in Europe/Amsterdam
    # during both summer time and winter time; the job below skips the wrong one.
    - cron: "0 8,9 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check Amsterdam hour
        id: timecheck
        run: |
          hour="$(TZ=Europe/Amsterdam date +%H)"
          if [ "$hour" = "10" ]; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.timecheck.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.timecheck.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m pip install pandas openpyxl

      - name: Generate data
        if: steps.timecheck.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
        run: python main.py

      - name: Commit updated data
        if: steps.timecheck.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- site/data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "Update site data"
          git push
